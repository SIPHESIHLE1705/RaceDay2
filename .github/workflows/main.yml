
name: RaceDay CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDAY_API/RaceDAY_API.csproj

      - name: Build API
        run: dotnet build RaceDAY_API/RaceDAY_API.csproj --configuration Release --no-restore

      - name: Restore test project
        run: dotnet restore RaceDay_test/RaceDay_test.csproj

      - name: Run unit tests
        run: dotnet test RaceDay_test/RaceDay_test.csproj --configuration Release
